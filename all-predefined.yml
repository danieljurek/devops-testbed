pr:
  branches:
    include:
      - main

jobs:
  - job: linux
    pool:
      name: azsdk-pool
      demands: ImageOverride -equals ubuntu-24.04

    steps:
    - pwsh: Get-Module -ListAvailable | Format-Table
      displayName: List modules
